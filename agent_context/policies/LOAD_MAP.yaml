version: 2026-05-18
purpose: >
  Fast routing map for Codex in ThesisAnalysis. Use this after reading
  AGENTS.md to decide which long-term policy files to load.

always_hot_state:
  - agent_context/CODEX_WORK_REGISTER.yaml
  - agent_context/ARTIFACT_REGISTRY.yaml
  - agent_context/TASK_BOARD.md
  - agent_context/STATUS_DASHBOARD.md

conditional_hot_state:
  memory_design:
    - agent_context/memory/README.md
    - agent_context/memory/CONTEXT_RESONANCE_INDEX.yaml
    - agent_context/memory/SCHEMA_REGISTRY.yaml
    - agent_context/memory/NEGATIVE_MEMORY_MAP.yaml
    - agent_context/policies/AGENT_MEMORY_DESIGN_NOTES.md
    - agent_context/policies/LEGACY_AGENTS_COVERAGE.md
  dataset_validity:
    - codex_notes/PROJECT_BOARD.md
    - codex_notes/DATASET_STATUS.md
    - codex_notes/KNOWN_ISSUES.md
    - codex_notes/RUN_LOG.md
  slide_style:
    - agent_context/SLIDE_STYLE_MAP.md
  science_references:
    - agent_context/REFERENCE_MAP.md
  thesis_narrative:
    - agent_context/THESIS_NARRATIVE_MAP.md
  dream_state:
    - agent_context/local/dreams/

routes:
  codex_operating_system:
    triggers:
      - add a task
      - add this task
      - add this to my task list
      - put this on my todo list
      - put this in the backlog
      - track this as a task
      - make this a Linear task
      - remember this as a task
      - Today's Plan
      - WORKING POINT
      - working point slides
      - current working slides
      - current slides
      - slide number without link
      - Linear
      - work register
      - active jobs
      - running tasks
      - Codex OS
      - heartbeat
      - workstream
      - handoff
      - multi-chat
    load:
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/MEMORY_AND_STATUS.md
    first_actions:
      - Read agent_context/CODEX_WORK_REGISTER.yaml before changing project
        state or starting meaningful multi-step work.
      - Claim or update exactly one workstream, including current next action,
        evidence, active jobs, and stale-after timing.
      - Mirror to Linear and Today's Plan when tools are available; otherwise
        leave linear_sync or today_doc_anchor pending.

  agentic_os_hardening:
    triggers:
      - agentic OS
      - OS hardening
      - self tuning
      - self-healing
      - symbiotic
      - control plane
      - operating system baseline
      - codex doctor
      - doctor checks
      - thesis narrative map
      - durable context
      - context resonance
      - memory salience
      - retrieval quality
      - failure to policy
      - postmortem
      - 10/10
    load:
      - agent_context/policies/AGENTIC_OS_HARDENING.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/MEMORY_AND_STATUS.md
    first_actions:
      - Read agent_context/THESIS_NARRATIVE_MAP.md and the work register before
        changing OS behavior.
      - Prefer executable checks, route updates, or compact policy patches over
        broad prose-only guidance.
      - Run scripts/codex_os_doctor.py before claiming the OS state is healthy.
      - Use scripts/codex_os_guard.py and scripts/codex_os_snapshot.py before
        risky mutations.
      - Use scripts/os/context/codex_context_pack.py, scripts/os/context/codex_thesis_radar.py,
        scripts/os/context/codex_context_resonance.py, and
        scripts/os/artifacts/codex_artifact_registry.py for boot context,
        thesis mapping, retrieval salience, and artifact provenance.
      - Create focused follow-up workstreams for enhancements instead of
        reopening the completed OS baseline.

  agentic_os_dreaming:
    triggers:
      - dream
      - dreaming
      - night simulation
      - synthetic Justin
      - synthetic rehearsal
      - morning report
      - nightly dream
      - lane heartbeat
      - context resonance
      - latent context
      - negative memory
      - self-play
      - dream automation
    load:
      - agent_context/policies/AGENTIC_OS_DREAMING.md
      - agent_context/policies/AGENTIC_OS_HARDENING.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/MEMORY_AND_STATUS.md
    first_actions:
      - Treat synthetic Justin as a test fixture, never user approval.
      - Keep dream writes confined to agent_context/local/dreams/.
      - Run scripts/codex_os_dream.py lane --lane-id <lane_id> for the
        relevant overnight dream lane.
      - Use scripts/os/context/codex_context_resonance.py resolve --task "<task>" --json
        when the request is about compact retrieval, stale-context suppression,
        or context-resonance evaluation.
      - Do not mutate SDCC, Gmail, Google Drive/Slides, Linear, or real
        repo-tracked state from a dream.
      - Promote dream proposals only in a waking task-capture or OS-update
        workflow with evidence.

  ask_chatgpt_delegation:
    triggers:
      - ask ChatGPT
      - use ChatGPT
      - ChatGPT UI
      - deep research in ChatGPT
      - external model research
      - delegated research
      - second model critique
      - ask another model
    load:
      - agent_context/policies/ASK_CHATGPT_DELEGATION.md
      - agent_context/policies/TOOLS_AND_DEPENDENCIES.md
      - agent_context/policies/COLLABORATION_AND_HANDOFFS.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
    first_actions:
      - Sanitize the prompt before typing into ChatGPT UI.
      - Do not transmit secrets, raw SDCC state, private email content,
        collaborator-sensitive notes, or unpublished analysis details without
        explicit action-time approval.
      - Use Chrome or Computer Use only for the bounded ChatGPT research task;
        stop for payments, upgrades, file uploads, account changes, or quota
        gates.
      - Save prompt, response, follow-ups, and Codex synthesis under
        agent_context/local/chatgpt_research/.
      - Treat ChatGPT output as source leads and critique only until verified
        against primary sources or local evidence.

  meeting_capture_zoom:
    triggers:
      - set up a Zoom room
      - open a Zoom room
      - make a Zoom room
      - start a Zoom room
      - get me a Zoom invite link
      - Zoom transcript
      - Zoom AI summary
      - meeting transcript
      - meeting capture
    load:
      - agent_context/policies/MEETING_CAPTURE_AND_ZOOM.md
      - agent_context/policies/TOOLS_AND_DEPENDENCIES.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/MEMORY_AND_STATUS.md
    first_actions:
      - For "set up a Zoom room" variants, treat the phrase as explicit
        permission to use Computer Use on Zoom for the narrow room-setup task.
      - Open Zoom, create/start the Justin-owned room, enable or verify
        transcript and AI-summary capture where Zoom exposes those controls,
        copy the invite link, and return the clean link plus caveats.
      - Do not imply transcription is invisible; Zoom recording/transcript/AI
        features can be visible to participants depending on host/account
        settings.
      - For meetings Justin only joins, do not secretly record or transcribe;
        use host-approved artifacts, notes, slides, calendar, Indico, or email.
      - After transcript/summary artifacts exist, route meeting outcomes
        through register -> Linear -> Today's Plan when relevant.

  duplicate_sensitive_run:
    triggers:
      - train
      - training
      - production
      - RecoilJets
      - validation
      - merge
      - rerun
      - submit
      - generate a new analysis
    load:
      - agent_context/policies/HARD_STOPS_AND_SAFETY.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/DUPLICATE_RUN_GUARD.md
      - agent_context/policies/SDCC_OPERATIONS.md
      - agent_context/policies/MEMORY_AND_STATUS.md
      - agent_context/policies/STORAGE_AND_CLEANUP.md
    first_actions:
      - Build a run fingerprint from requested dataset, model, features, cuts,
        tag, config YAML, source paths, output roots, and objective.
      - Check and update agent_context/CODEX_WORK_REGISTER.yaml for active
        ownership before any new work is launched.
      - Search hot state, dataOutput, InputFiles, and relevant SDCC/Gmail
        evidence for materially equivalent runs.
      - Run scripts/codex_os_guard.py fingerprint/preflight before any
        duplicate-sensitive risky mutation.
      - Stop and report immediately if a match exists.

  sdcc_status:
    triggers:
      - status
      - stuck
      - held
      - finished
      - what is going on
      - watchdog
      - heartbeat
    load:
      - agent_context/policies/EMAIL_AND_WATCHDOGS.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/SDCC_OPERATIONS.md
      - agent_context/policies/MEMORY_AND_STATUS.md
    first_actions:
      - Check RecoilJets Pipeline Gmail first for active campaigns.
      - Then inspect visible terminal or one compact nested SSH diagnostic.
      - Update active job status, next_check, and stale_after in the work
        register when the check changes state.

  plotting:
    triggers:
      - plot
      - PNG
      - figure
      - slide-ready
      - visualize
    load:
      - agent_context/policies/PLOTTING.md
      - agent_context/policies/REPO_ORGANIZATION.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/INPUTS_AND_ENVIRONMENT.md
      - agent_context/policies/SCIENCE_REFERENCE_HIERARCHY.md
    first_actions:
      - Identify source data and provenance.
      - Claim/update the relevant workstream before generating a plot batch.
      - Reuse existing plotting infrastructure.
      - Put any new helper in the clearest safe scripts/macros subfolder.
      - View generated PNGs before calling them ready.

  repo_organization:
    triggers:
      - organize scripts
      - organize macros
      - repo organization
      - clean up scripts
      - clean up macros
      - new plotting script
      - new slide generator
      - new ROOT macro
      - new macro
      - helper script
      - side script
      - diagnostics helper
      - scripts/macros
    load:
      - agent_context/policies/REPO_ORGANIZATION.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/MEMORY_AND_STATUS.md
      - agent_context/policies/TRANSFER_AND_PIPELINE_FILES.md
    first_actions:
      - Search existing scripts/macros before adding a new file.
      - Classify the target as protected SDCC/Fun4All/pipeline entrypoint or
        local-side helper.
      - For protected anchors, preserve current paths and require explicit
        compatibility migration approval before moves.
      - For local-side helpers, use or create the narrowest safe subfolder and
        update local README/policy notes when the convention is reusable.
      - After THE-23 stage 4, treat top-level scripts as active compatibility
        aliases only; use scripts/SCRIPT_INDEX.yaml, scripts/HELPER_INDEX.yaml,
        and scripts/slides/INDEX.yaml for canonical traversal.

  slides:
    triggers:
      - Google Slides
      - deck
      - slide
      - presentation
      - JSTG
    load:
      - agent_context/policies/SLIDES_WORKFLOW.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/PLOTTING.md
      - agent_context/policies/REPO_ORGANIZATION.md
    first_actions:
      - Resolve deck ID and slide object ID.
      - Claim/update the relevant workstream before editing or generating
        slide candidates.
      - Prefer connector reads and thumbnails.
      - Do not use Computer Use without explicit per-session permission.

  transfer:
    triggers:
      - upload
      - sftp
      - push to SDCC
      - pull outputs
      - get outputs
      - in sync
    load:
      - agent_context/policies/TRANSFER_AND_PIPELINE_FILES.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/SDCC_OPERATIONS.md
    first_actions:
      - Classify as status, diff, upload, download, local-only merge, or
        commit-push after upload.
      - Record transfer ownership, protected paths, and next check in the
        work register if the transfer creates follow-up state.
      - Use the smallest helper command that covers the intended files.

  tools_dependencies:
    triggers:
      - missing tool
      - dependency
      - plugin
      - browser
      - gmail
      - drive
      - slides connector
    load:
      - agent_context/policies/TOOLS_AND_DEPENDENCIES.md
    first_actions:
      - Prefer existing project wrappers, scripts, skills, and connector tools.
      - Ask before installing software or changing global environment state.

  collaboration_handoffs:
    triggers:
      - handoff
      - delegate
      - subagent
      - Claude
      - parallel lanes
    load:
      - agent_context/policies/COLLABORATION_AND_HANDOFFS.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
    first_actions:
      - Keep lanes disjoint and handoffs compact.
      - Use the work register to prevent two chats or agents from owning the
        same active lane.
      - Preserve Codex ownership of orchestration and final integration.

  cleanup:
    triggers:
      - cleanup
      - quota
      - stale
      - remove outputs
      - storage
      - delete
    load:
      - agent_context/policies/STORAGE_AND_CLEANUP.md
      - agent_context/policies/CODEX_OPERATING_SYSTEM.md
      - agent_context/policies/MEMORY_AND_STATUS.md
      - agent_context/policies/SDCC_OPERATIONS.md
    first_actions:
      - Separate live/protected, useful small evidence, offline/compress, and
        safe-to-remove-after-approval.

  dataset_validity:
    triggers:
      - stale
      - valid
      - ABCD
      - purity
      - tight-axis
      - dataset
    load:
      - agent_context/policies/CURRENT_PROJECT_STATE.md
      - agent_context/policies/SCIENCE_REFERENCE_HIERARCHY.md
      - agent_context/policies/MEMORY_AND_STATUS.md
    first_actions:
      - Check whether requested plots/outputs consume affected histogram
        families before warning broadly.
