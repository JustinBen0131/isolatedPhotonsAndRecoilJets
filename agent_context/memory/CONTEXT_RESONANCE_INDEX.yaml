    source_pointer:
      path: agent_context/policies/SLIDES_WORKFLOW.md
      kind: policy
    routes:
      - slide_scripting
    cue_terms:
      - slide
      - deck
      - presentation
      - google
      - script
      - png
      - style
      - thread
    relation_type: visual_style
    evidence_class: human_approved
    retrieval_policy: latent_nudge
    allowed_use: method cue only
    required_waking_check: verify deck target, source PNG, visual approval state, and style map before continuing a prior slide context
    why_it_surfaced: deck work benefits from reusing context only when the deck, screenshots, and wording tone remain the same durable object
    salience:
      thesis_value: 0.65
      evidence_value: 0.7
      recurrence: 0.65
      error_prevention_value: 0.75
      user_friction: 0.75
      cross_domain_analogy_value: 0.25
      retrieval_cost: 0.2
      stale_risk: 0.25
      interference_risk: 0.25
      synthetic_contamination_risk: 0.0
