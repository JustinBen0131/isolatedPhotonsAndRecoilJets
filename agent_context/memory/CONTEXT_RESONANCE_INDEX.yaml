version: 1
purpose: >
  Durable, non-sensitive salience records for waking context routing. These are
  compact cue records, not raw transcripts or factual evidence by themselves.
allowed_relation_types:
  - same_artifact
  - same_method
  - same_failure_mode
  - analogy_only
  - warning_only
  - visual_style
  - path_contract
allowed_evidence_classes:
  - real_observed
  - human_approved
  - derived
  - synthetic
allowed_retrieval_policies:
  - conscious_context
  - latent_nudge
  - suppress
  - quarantine_candidate

memory_records:
  - memory_id: plot_readiness_requires_provenance
    title: Plot readiness requires provenance and visual QA
    source_pointer:
      path: agent_context/policies/PLOTTING.md
      kind: policy
    routes:
      - plot_generation
      - slide_scripting
    cue_terms:
      - plot
      - figure
      - png
      - slide-ready
      - provenance
      - visual
      - qa
      - artifact
    relation_type: same_failure_mode
    evidence_class: human_approved
    retrieval_policy: latent_nudge
    allowed_use: warning only
    required_waking_check: check source inputs, generation command, artifact registry entry, and visual QA before calling ready
    why_it_surfaced: plot or slide-facing work often fails when visual readiness is claimed before provenance and visual QA
    salience:
      thesis_value: 0.85
      evidence_value: 0.85
      recurrence: 0.75
      error_prevention_value: 0.95
      user_friction: 0.8
      retrieval_cost: 0.15
      stale_risk: 0.05
      interference_risk: 0.15
      synthetic_contamination_risk: 0.0
    state:
      temperature: hot
      plasticity: stable

  - memory_id: sdcc_path_contract_drift
    title: SDCC and transfer path work needs canonical-path checks
    source_pointer:
      path: agent_context/policies/TRANSFER_AND_PIPELINE_FILES.md
      kind: policy
    routes:
      - sdcc_path_transfer
    cue_terms:
      - sdcc
      - sftp
      - transfer
      - remote
      - path
      - compatibility
      - checkout
      - bulk
    relation_type: path_contract
    evidence_class: human_approved
    retrieval_policy: latent_nudge
    allowed_use: warning only
    required_waking_check: use transfer maps and read-only status checks before uploads or remote edits
    why_it_surfaced: remote/local path work can silently drift unless canonical and compatibility paths are checked
    salience:
      thesis_value: 0.8
      evidence_value: 0.8
      recurrence: 0.85
      error_prevention_value: 0.95
      user_friction: 0.85
      retrieval_cost: 0.2
      stale_risk: 0.2
      interference_risk: 0.1
      synthetic_contamination_risk: 0.0
    state:
      temperature: hot
      plasticity: stable

  - memory_id: slide_thread_reuse_capsule
