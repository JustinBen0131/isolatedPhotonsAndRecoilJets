    trigger_pattern: a mistake, near miss, or repeated correction needs a durable OS lesson
    required_waking_check: record trigger, category, concrete evidence, reusable lesson, chosen mechanism, validation, and handoff
    validator_hint: os_reflection_template
    salience:
      thesis_value: 0.75
      evidence_value: 0.85
      recurrence: 0.8
