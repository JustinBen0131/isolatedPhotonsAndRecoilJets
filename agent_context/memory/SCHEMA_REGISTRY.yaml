      - doctor
      - policy
      - schema
      - negative
      - atom
      - evidence
    relation_type: same_method
    evidence_class: human_approved
    allowed_use: promotion gate only
    trigger_pattern: a proposal-only dream atom is being considered for tracked policy, schema, style, validator, task, or memory mutation
    required_waking_check: preserve raw evidence, keep the change narrow, pass privacy/synthetic filters, run the relevant validator and doctor, and require Justin approval for risky or external surfaces
