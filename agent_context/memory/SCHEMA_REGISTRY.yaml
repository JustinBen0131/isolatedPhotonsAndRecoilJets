      - slide
    relation_type: same_method
    evidence_class: human_approved
    allowed_use: method cue only
    trigger_pattern: Justin corrects a generated plot, slide candidate, or speaker script and the lesson may recur
    required_waking_check: cite the user correction, before/after artifact, and chosen durable mechanism before promotion
    validator_hint: slide_feedback_record
    salience:
      thesis_value: 0.8
      evidence_value: 0.85
      recurrence: 0.95
