      - learning
      - atom
      - proposal
      - recurrence
      - promotion
      - validator
      - evidence
      - nightly
      - terminal_path_alignment
      - finitude_pressure
      - regret_if_unfixed
      - novelty_gate
    relation_type: same_method
    evidence_class: human_approved
    allowed_use: method cue only
    trigger_pattern: nightly dream pressure needs to become a bounded, evidence-linked, waking-promotable improvement unit
    required_waking_check: verify raw episode path, real evidence refs, proposal-only boundary, finitude fields, validator command, retention rule, and promotion status before any tracked memory or policy mutation
