version: 1
purpose: >
  Compact repeated traps that should surface as warnings. These are not
  factual proof; they name first safe actions.

negative_memories:
  - memory_id: no_ready_without_evidence
    trap: calling an artifact ready from memory or filename alone
    source_pointer:
      path: agent_context/policies/PLOTTING.md
      kind: policy
    routes:
      - plot_generation
      - slide_scripting
    cue_terms:
      - plot
      - figure
      - png
      - ready
      - evidence
      - artifact
      - provenance
    relation_type: warning_only
    evidence_class: human_approved
    retrieval_policy: latent_nudge
    allowed_use: warning only
    first_safe_action: check artifact registry, source path, generation command, and visual or ROOT QA
    required_waking_check: cite exact evidence before ready, valid, stale, or done claims
    salience:
      thesis_value: 0.85
      evidence_value: 0.85
      recurrence: 0.8
      error_prevention_value: 0.95
      user_friction: 0.85
      retrieval_cost: 0.1
      stale_risk: 0.05
      interference_risk: 0.1
      synthetic_contamination_risk: 0.0

