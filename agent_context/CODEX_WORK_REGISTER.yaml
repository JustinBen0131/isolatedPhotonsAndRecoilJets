  - workstream_id: logreg_bdt_decision_structure_check
    title: Logistic Regression Check | BDT Decision-Structure Probe
    status: backlog
    priority: P2
    goal: >
      Test whether the selected BDT's advantage comes from interdependent,
      thresholded, nonlinear decision structure across photon-ID variables, or
      whether most separation is already captured by a linear logistic
      regression decision surface.
    current_next_action: >
      Keep as THE-8 backlog. When promoted, duplicate-guard existing logistic
      regression and stacker artifacts first, especially
      ppg12_weighted_stack_logreg_gbm_20260522_1328 and legacy logreg full-chain
      outputs. Then assemble or train one matched logistic-regression baseline
      against the selected BDT using the same samples, features, PPG12-exact
      weights, split, ET/centrality validation bins, and score-cache gates.
      Compare WP80 fake rate, score-shape stability, AUC, pathological bins,
      and isolation/ABCD closure. Interpret a near-match as evidence that the
      feature set is mostly linearly separable; interpret a bin-local failure
      as direct evidence for the BDT's nonlinear/interdependent decision value.
