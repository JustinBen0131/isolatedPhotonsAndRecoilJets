      - "2026-06-05 PPG19 Zoom summary assigned Justin to inspect Pythia particle lists for high-BDT jets/candidates and middling-BDT photons so BDT performance is explained physically, not only by AUC/logloss."
      - "Linear THE-44 created on 2026-06-05 as a focused child of THE-8, due 2026-06-12."
      - "2026-06-05 bridge audit found current score caches/training tree do not persist a clean HEPMC particle-list bridge; RecoilJets runtime has PHHepMCGenEventMap and Calo truth access, so a small env-gated diagnostic campaign is required."
      - "2026-06-05 local instrumentation added THE44PythiaAutopsyTree behind RJ_THE44_PYTHIA_AUTOPSY=1; git diff --check passed, local compile blocked by missing Fun4All headers."
      - "2026-06-05 SDCC src_AuAu make clean && makeProject succeeded after uploading RecoilJets_AuAu.cc/.h; Condor submitter was patched/uploaded so RJ_THE44_PYTHIA_AUTOPSY* controls propagate to SIM workers."
      - "2026-06-05 bounded Jet40 diagnostic cluster 5537520 finished exit_code=0, elapsed 10:51, max RSS 1.15 GB, output 3.6 MB. PyROOT found THE44PythiaAutopsyTree with 12 entries: 10 high-BDT background and 2 middling-BDT signal."
      - "2026-06-05 bounded Photon20 diagnostic cluster 5537521 finished exit_code=0, elapsed 14:34, max RSS 1.14 GB, output 5.5 MB. PyROOT found THE44PythiaAutopsyTree with 108 entries: 8 high-BDT background and 100 middling-BDT signal."
