schema_version: 1
last_updated: "2026-05-28T11:07:00-04:00"
owner: Codex
purpose: >
  Canonical active-work register for the ThesisAnalysis operating system.
  Google Docs and Linear are user-facing projections of this file, not the
  source of truth.

status_vocabulary:
  - active
  - running
  - waiting
  - blocked
  - review
  - backlog
  - done_pending_review
  - archived

status_colors:
  active: green
  running: amber
  waiting: blue-gray
  blocked: red
  review: amber
  backlog: gray
  done_pending_review: muted-green
  archived: muted-gray

linear:
  operating_rule: >
    Codex operates Linear for Justin. Use one issue per durable workstream,
    not one issue per command or transient step.
  default_project: ThesisAnalysis Operating System
  project_url: "https://linear.app/thesisanalysis/project/thesisanalysis-operating-system-f71a34a98c96"
  operating_rules_document: "https://linear.app/thesisanalysis/document/codex-operating-rules-c21ca9aee5f6"
  dashboard_doctrine_document: "https://linear.app/thesisanalysis/document/linear-dashboard-doctrine-v2-codex-justin-ed7e8dba8149"
  campaign_chat_map_doctrine_document: "https://linear.app/thesisanalysis/document/campaign-codex-chat-map-doctrine-9a78c1eec93a"
  ux_rule: >
    Linear is the durable detailed dashboard behind the one-page Today's Plan.
    Titles, labels, and first-screen issue bodies should make the board
    readable within 30 seconds.
  title_prefixes:
    p0_campaign: "P0 Campaign |"
    p0_approval: "P0 Approval |"
    running_stitching: "RUN Stitching |"
    p0_ml: "P0 ML |"
    p1_closure: "P1 Closure |"
    waiting_validation: "WAIT Validation |"
    backlog: "BKL"
    os_baseline: "OS Baseline |"
  label_taxonomy:
    surface:
      - "Surface: Today"
      - "Surface: Linear Detail"
    area:
      - "Area: Approval"
      - "Area: Stitching"
      - "Area: ML"
      - "Area: Trigger"
    ops:
      - "Ops: Active Jobs"
      - "Ops: Health Check"
    decision:
      - "Needs: Justin Review"
      - "Slide-facing"
    required:
      - Workstream
      - Codex OS
  issue_body_template:
    - Goal
    - Current next action
    - Why this matters
    - Codex chat map
    - Depends on
    - Evidence
    - Codex operating rule
    - Daily surface
  lanes:
    - Do First
    - Active
    - Running
    - Waiting
    - Blocked
    - Review
    - Backlog
    - Done Pending Archive
  sync_state: synced
  sync_note: >
    If Linear tools are unavailable in a session, keep this register current
    and mark affected workstreams linear_sync: pending.
  campaign_rule: >
    Campaign issues are the Linear home base for umbrella goals spanning
    multiple chats, jobs, slide assets, and validation tasks. Each active
    workstream must either name its campaign_id or explicitly stand alone.
    Active Linear issue bodies/comments must include Codex chat labels, thread
    ids when available, heartbeat ids, active run tags, and DAG clusters.

daily_cockpit:
  primary_surface: "Today's Plan"
  current_today_plan:
    date: "2026-05-28"
    title: "2026-05-28 - Today's Plan"
    url: "https://docs.google.com/document/d/1yHOHxbZuglIHHyfCRPvl8VjYzOkooYS-GY5SZDPBwvQ/edit?usp=drivesdk"
    note: >
      Created by the Google Drive connector. The exposed create_file action did
      not support parent-folder targeting, so placement in workingTasks was not
      verified by connector metadata.
  drive_folder: "workingTasks"
  rule: >
    Today's Plan is a short visual cockpit generated from active, running,
    waiting, blocked, review, and backlog register entries. Do not roll
    completed history forward.
  active_working_point_deck:
    label: "WORKING POINT"
    title: "current working-point slides"
    url: "https://docs.google.com/presentation/d/1-2l9IWNJMpFfunoShVrYk3ywtrIocMWMyePYnR85_zc/edit?slide=id.g3a89b5423f1_0_265#slide=id.g3a89b5423f1_0_265"
    rollover_rule: >
      Every new Today's Plan must include this line near the top. Copy the
      WORKING POINT link from the previous daily plan unless Justin edits that
      line or explicitly provides a replacement link. Before rendering a new
      daily plan, read the previous/current Today's Plan; if its WORKING POINT
      line differs from this register, treat the doc as Justin's latest edit
      and update this register first.
    default_prompt_rule: >
      If Justin asks about slides or a slide number without specifying a deck
      link, use this working-point deck as the default slide context.
  morning_health_check:
    rule: >
      Include a compact read-only operational snapshot near the top of the
      daily cockpit. This belongs in Today's Plan, not only Linear, because it
      tells Justin whether the analysis environment is safe to use that day.
    quota_checks:
      - label: tg_bulk_jbennett
        path: "/sphenix/tg/tg01/bulk/jbennett"
        report: >
          Justin-owned Lustre quota from lfs quota: used/quota percent and
          file-count percent. Do not substitute shared filesystem df totals.
      - label: sphenix_user_scratch
        path: "/sphenix/u/patsfan753/scratch -> /sphenix/user/patsfan753"
        report: >
          Justin scratch target. If lfs/quota does not expose a personal
          percentage for this GPFS path, say so explicitly and do not report
          shared /gpfs df usage as Justin's personal usage.
      - label: sphenix_u_home
        path: "/sphenix/u/patsfan753"
        report: "Small home quota from quota -s: used/quota percent."
    condor_checks:
      helper: "./checkCondorQ"
      report: >
        Justin's queued/running/held/idle job counts, any held-job warning,
        and a one-line reminder of which registered workstream/chat submitted
        each active job group.
    notes: >
      Read-only only. Do not remove jobs, clean files, rerun merges, or submit
      recovery work from the morning health check without explicit approval.
  sections:
    - Do First Today
    - Morning Health Check
    - Active Slide Deck
    - HP26 Deadline Driver
    - Live Codex Work
    - Active Workstreams
    - Waiting / Blocked / Review
    - Backlog
    - Done Today
    - Scratch / Inbox

