schema_version: 1
last_updated: "2026-06-07T15:16:14-04:00"
owner: Codex
purpose: >
  Canonical active-work register for the ThesisAnalysis operating system.
  Google Docs and Linear are user-facing projections of this file, not the
  source of truth.

status_vocabulary:
  - active
  - running
  - waiting
  - blocked
  - review
  - backlog
  - complete
  - done_pending_review
  - archived

status_colors:
  active: green
  running: amber
  waiting: blue-gray
  blocked: red
  review: amber
  backlog: gray
  complete: muted-green
  done_pending_review: muted-green
  archived: muted-gray

linear:
  operating_rule: >
    Codex operates Linear for Justin. Use one issue per durable workstream,
    not one issue per command or transient step.
  default_project: ThesisAnalysis Operating System
  project_url: "https://linear.app/thesisanalysis/project/thesisanalysis-operating-system-f71a34a98c96"
  operating_rules_document: "https://linear.app/thesisanalysis/document/codex-operating-rules-c21ca9aee5f6"
  dashboard_doctrine_document: "https://linear.app/thesisanalysis/document/linear-dashboard-doctrine-v2-codex-justin-ed7e8dba8149"
  campaign_chat_map_doctrine_document: "https://linear.app/thesisanalysis/document/campaign-codex-chat-map-doctrine-9a78c1eec93a"
  ux_rule: >
    Linear is the durable detailed dashboard behind the one-page Today's Plan.
    Titles, labels, and first-screen issue bodies should make the board
    readable within 30 seconds.
  title_prefixes:
    p0_campaign: "P0 Campaign |"
    p0_approval: "P0 Approval |"
    running_stitching: "RUN Stitching |"
    p0_ml: "P0 ML |"
    p1_closure: "P1 Closure |"
    waiting_validation: "WAIT Validation |"
    backlog: "BKL"
    os_baseline: "OS Baseline |"
  label_taxonomy:
    surface:
      - "Surface: Today"
      - "Surface: Linear Detail"
    area:
      - "Area: Approval"
      - "Area: Stitching"
      - "Area: ML"
      - "Area: Trigger"
      - "Area: PDC"
    ops:
      - "Ops: Active Jobs"
      - "Ops: Health Check"
    decision:
      - "Needs: Justin Review"
      - "Slide-facing"
    required:
      - Workstream
      - Codex OS
  issue_body_template:
    - Goal
    - Current next action
    - Why this matters
    - Codex chat map
    - Depends on
    - Evidence
    - Codex operating rule
    - Daily surface
  lanes:
    - Do First
    - Active
    - Running
    - Waiting
    - Blocked
    - Review
    - Backlog
    - Done Pending Archive
  sync_state: synced
  sync_note: >
    If Linear tools are unavailable in a session, keep this register current
    and mark affected workstreams linear_sync: pending.
  campaign_rule: >
    Campaign issues are the Linear home base for umbrella goals spanning
    multiple chats, jobs, slide assets, and validation tasks. Each active
    workstream must either name its campaign_id or explicitly stand alone.
    Active Linear issue bodies/comments must include Codex chat labels, thread
    ids when available, heartbeat ids, active run tags, and DAG clusters.

