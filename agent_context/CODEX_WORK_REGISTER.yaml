      Do not change morning-priorities or live job/status heartbeats.
    daily_plan_line: "Context Conservation Mode: ON; dream lanes paused; use targeted context only."
    calendar_reminder_event_ids:
      - "2026-06-08:ugg9noo7bkqj754cg79fvo7oac"
      - "2026-06-09:8occa9q6s387nnkk4m18nfnqv4"
      - "2026-06-10:d948oom05t8i5f80qatbfn8deg"
      - "2026-06-11:3aqmce64ph8ubr663efqan23o8"
    last_verified: "2026-06-07T16:07:48-04:00"
  current_today_plan:
    date: "2026-06-07"
    title: "2026-06-07 - Today's Plan"
    url: "https://docs.google.com/document/d/1-TFErRblsD63OmirlIOnVYO4HOvH5HUI7Q7s36c-Ff4/edit?usp=drivesdk"
    note: >
      Created by the Google Drive connector from a styled local HTML source at
      agent_context/local/daily_plans/2026-06-07-todays-plan.html. The exposed
      import action did not support parent-folder targeting, so placement in
      workingTasks was not verified by connector metadata. This version keeps
      the first page compact: THE-42 and THE-35 read-only status checks first,
      HP26 Monday walkthrough prep third, dream output summarized as
      proposal-only OS signal, and stale doctor/frozen-growth pressure reported
      as maintenance risk rather than science-output failure.
  short_horizon_priorities:
    window: "2026-06-03 through 2026-06-09"
    rule: >
      Until Friday's PPG meeting, rank ML analysis and PPG working-point slides
      first. Rank HP2026 scripting and slide cleanup second for an
      Anne/Anthony/Apurva walkthrough Monday 2026-06-08 at 13:00 Central /
      14:00 Eastern. Move PDC/calibrations out of the immediate weekend push;
      its target is now a June 29 Calorimeter Calibrations presentation after
      Hard Probes.
    ordered:
      - "P1-now: THE-8/THE-32 ML analysis and Friday PPG slides."
      - "P2-now: THE-5 HP2026 script, backup, and slide cleanup due before Monday 2026-06-08 13:00 CT walkthrough."
      - "Upcoming: THE-25 PDC position-dependent-correction update for June 29 Calorimeter Calibrations after Hard Probes."
  drive_folder: "workingTasks"
  rule: >
    Today's Plan is a short visual cockpit generated from active, running,
    waiting, blocked, review, and backlog register entries. Do not roll
    completed history forward.
  active_working_point_deck:
    label: "WORKING POINT"
    title: "WP_GammaJets_6_3_26"
    url: "https://docs.google.com/presentation/d/1D_m5vPM3eJIBI0nMz9RxAzZcjr15KQaG2uLOTjRTXOY/edit?slide=id.g3dc0f31b83d_0_0#slide=id.g3dc0f31b83d_0_0"
    rollover_rule: >
      Every new Today's Plan must include this line near the top. Copy the
      WORKING POINT link from the previous daily plan unless Justin edits that
      line or explicitly provides a replacement link. Before rendering a new
      daily plan, read the previous/current Today's Plan; if its WORKING POINT
      line differs from this register, treat the doc as Justin's latest edit
      and update this register first.
    default_prompt_rule: >
      If Justin asks about slides or a slide number without specifying a deck
      link, use this working-point deck as the default slide context.
  morning_health_check:
    rule: >
      Include a compact read-only operational snapshot near the top of the
      daily cockpit. This belongs in Today's Plan, not only Linear, because it
      tells Justin whether the analysis environment is safe to use that day.
    quota_checks:
      - label: tg_bulk_jbennett
        path: "/sphenix/tg/tg01/bulk/jbennett"
        report: >
          Justin-owned Lustre quota from lfs quota: used/quota percent and
          file-count percent. Do not substitute shared filesystem df totals.
      - label: sphenix_user_scratch
        path: "/sphenix/u/patsfan753/scratch -> /sphenix/user/patsfan753"
        report: >
          Justin scratch target. If lfs/quota does not expose a personal
          percentage for this GPFS path, say so explicitly and do not report
          shared /gpfs df usage as Justin's personal usage.
      - label: sphenix_u_home
        path: "/sphenix/u/patsfan753"
        report: "Small home quota from quota -s: used/quota percent."
    condor_checks:
      helper: "./checkCondorQ"
      report: >
        Justin's queued/running/held/idle job counts, any held-job warning,
        and a one-line reminder of which registered workstream/chat submitted
        each active job group.
    notes: >
      Read-only only. Do not remove jobs, clean files, rerun merges, or submit
      recovery work from the morning health check without explicit approval.
  sections:
    - Do First Today
    - Morning Health Check
    - Active Slide Deck
    - HP26 Deadline Driver
    - Live Codex Work
    - Active Workstreams
    - Waiting / Blocked / Review
    - Backlog
    - Done Today
    - Scratch / Inbox

