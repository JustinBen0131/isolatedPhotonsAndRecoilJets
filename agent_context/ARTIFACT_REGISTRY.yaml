    qa_state: candidate
    qa_evidence:
      - "Guard preflight added for risky mutation scope, approval, duplicate fingerprint, snapshot, and event-ledger checks."
    limitations: "Approval-gated guard only; it does not execute the risky action itself."
    destination: "Required preflight for risky ThesisAnalysis mutations"
    last_verified: "2026-05-27T00:45:00-04:00"

  - artifact_id: os_snapshot_kernel
    kind: script
    path: scripts/codex_os_snapshot.py
    thesis_claim: os_infrastructure
    source_inputs:
      - AGENTS.md
      - agent_context/policies/AGENTIC_OS_HARDENING.md
      - scripts/codex_os_guard.py
    generation_command: "python3 scripts/codex_os_snapshot.py create --label <scope>"
    qa_state: candidate
    qa_evidence:
      - "Snapshot helper added to preserve tracked OS core before risky mutations."
    limitations: "Snapshots are private local archives under agent_context/local and are not a substitute for Git history."
    destination: "Local rollback and inspection support for OS state"
    last_verified: "2026-05-27T00:45:00-04:00"

  - artifact_id: thesis_nervous_system_tools
    kind: script_bundle
    path: scripts/os/context/codex_context_pack.py
