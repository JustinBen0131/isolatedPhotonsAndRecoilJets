schema_version: 1
last_updated: "2026-06-01T22:06:29-04:00"
owner: Codex
purpose: >
  Canonical provenance registry for thesis-facing artifacts. Register plots,
  ROOT files, CSV/JSON summaries, slide candidates, scripts, and OS evidence
  bundles before treating them as reusable or slide-ready.

quality_states:
  - candidate
  - qa_passed
  - slide_ready
  - superseded
  - invalid

claim_layers:
  - physics_target
  - pp_baseline
  - embedded_background
  - ml_photon_id
  - auau_response
  - final_physics
  - os_infrastructure

required_artifact_fields:
  - artifact_id
  - kind
  - path
  - thesis_claim
  - source_inputs
  - generation_command
  - qa_state
  - qa_evidence
  - limitations
  - destination
  - last_verified

artifacts:
  - artifact_id: codex_os_doctor
    kind: script
    path: scripts/codex_os_doctor.py
    thesis_claim: os_infrastructure
    source_inputs:
      - agent_context/CODEX_WORK_REGISTER.yaml
      - agent_context/policies/LOAD_MAP.yaml
      - agent_context/THESIS_NARRATIVE_MAP.md
    generation_command: "python3 scripts/codex_os_doctor.py --profile daily"
    qa_state: qa_passed
    qa_evidence:
      - "2026-05-26 hardening pass: doctor executable existed and passed after OS policy routing was added."
    limitations: "Checks OS health and state hygiene; it does not validate physics correctness."
    destination: "Codex OS health gate"
    last_verified: "2026-05-26T23:50:00-04:00"

  - artifact_id: thesis_narrative_map
    kind: policy_map
    path: agent_context/THESIS_NARRATIVE_MAP.md
    thesis_claim: os_infrastructure
    source_inputs:
      - agent_context/policies/AGENTIC_OS_HARDENING.md
      - agent_context/CODEX_WORK_REGISTER.yaml
    generation_command: "manual Codex policy update from Justin's thesis-OS request"
    qa_state: qa_passed
    qa_evidence:
      - "2026-05-26 hardening pass added the durable claim hierarchy and promotion gate."
    limitations: "Must be updated when collaborator feedback changes the thesis proof obligations."
    destination: "Boot context for future Codex chats and thesis review"
    last_verified: "2026-05-26T23:50:00-04:00"

  - artifact_id: artifact_registry_seed
    kind: registry
    path: agent_context/ARTIFACT_REGISTRY.yaml
    thesis_claim: os_infrastructure
    source_inputs:
      - agent_context/THESIS_NARRATIVE_MAP.md
      - agent_context/policies/AGENTIC_OS_HARDENING.md
    generation_command: "python3 scripts/os/artifacts/codex_artifact_registry.py check"
    qa_state: candidate
    qa_evidence:
      - "Seed registry added during 10/10 OS safety-kernel implementation."
    limitations: "Only seeds OS artifacts; analysis plot/ROOT artifacts should be added as they become canonical."
    destination: "Artifact provenance source of truth"
    last_verified: "2026-05-27T00:00:00-04:00"

  - artifact_id: os_safety_kernel
    kind: script_bundle
    path: scripts/codex_os_guard.py
    thesis_claim: os_infrastructure
    source_inputs:
      - agent_context/policies/HARD_STOPS_AND_SAFETY.md
      - agent_context/policies/DUPLICATE_RUN_GUARD.md
