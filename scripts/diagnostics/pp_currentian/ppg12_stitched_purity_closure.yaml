{
  "schema": "ppg12-stitched-purity-closure-contract/v1",
  "description": "Fail-closed admission and production verification for the complete PPG12 stitched-purity estimator. This file is JSON-compatible YAML so the gate has no non-standard Python dependency.",
  "schema_notes": {
    "pair_manifest": "schema, role, abcd_population, external_scale, random_seed, toy_count, provenance, lanes, canonical global_minimality prefix evidence, and purity; candidate/production roles additionally require candidate_parity",
    "lane": "lane_id, family, sample, period, interaction, group_count>=1, group_size=5, group_index_start=0, event_set_row_count=5*group_count, deterministic group identities/hashes, one independently extractable sidecar per group, external_scale=1, paired-lane SHA fields, canonical extraction links, and observables; photon lanes additionally require the exact candidate-row trace",
    "observable": "bin_edges plus equally sized sumw, sumw2, and fills vectors",
    "candidate_parity": "exact 12-lane photon-canary coverage, hash-bound raw candidate CSVs re-audited by the canonical executable-evidence checker, the frozen feature/score tolerances, population counts, per-feature tolerance summaries, both score-model summaries, model-route summary, and common/tight/non_tight/abcd tag summaries",
    "global_minimality": "all 32 group-zero extracts form the mandatory baseline; additional five-file groups are ordered by group_index/lane_id/group_id, every prefix addition must reduce the globally missing required reported-cell set, and production stops at the first complete prefix; all group cells are regenerated by the canonical extractor and must sum to their lane aggregate",
    "purity": "shared bin_edges and truth/raw/corrected objects containing value and error vectors, byte-identical diagnostics from a fixed-seed repeated estimator evaluation, canonical producer/source links, and the exact 32-lane input set",
    "production_wrapper": "schema, admission_sha256, reference_manifest/candidate_manifest/merge_audit path+file-SHA links, exact inclusive/photon candidate_artifacts identical to the ROOT-native merge-audit outputs, and explicit final-purity, ABCD-count, and leakage historical_archive_comparison statistics"
  },
  "abcd_population": "unsuffixed",
  "external_scale": 1.0,
  "random_seed": 42,
  "toy_count": 20000,
  "periods": ["0mrad", "1p5mrad"],
  "interactions": ["si", "di"],
  "required_candidate_artifact_families": ["inclusive", "photon"],
  "admission_group_contract": {
    "minimum_group_count": 1,
    "group_size": 5,
    "minimum_root_bytes": 50000
  },
  "lane_runtime_contract": {
    "manifest_schema_version": 1,
    "build_receipt_required": true,
    "required_manifest_values": {
      "runtime_profile": "new.17",
      "isolated_build": true,
      "estimator_revision": "29f8223bd9b36dffab07961b597afa94185bbdf1"
    },
    "hash_semantics": "sha256 of the canonical sorted role-plus-file-digest set; paths are re-resolved for byte validation but excluded from the portable set digest",
    "required_roles_by_lane_field": {
      "config_sha256": [
        "lane_config",
        "ppg_apply_bdt_config",
        "ppg_recoeff_period_config"
      ],
      "reconstruction_sha256": [
        "recoil_macro",
        "recoil_impl",
        "libRecoilJets.so",
        "libCaloAna24.so",
        "libcalo_reco.so",
        "libclusteriso.so",
        "libjetbase.so",
        "PhotonClusterBuilder.h"
      ],
      "model_set_sha256": [
        "ppg_apply_model_base_E",
        "ppg_apply_model_base_v3E",
        "ppg_apply_npb_model"
      ],
      "ownership_sha256": [
        "recoil_impl",
        "libRecoilJets.so"
      ],
      "weight_sha256": [
        "recoil_impl",
        "ppg_recoeff_cross_section_header",
        "ppg_recoeff_truth_vertex_header",
        "ppg_recoeff_period_config",
        "ppg_recoeff_truth_vertex_reweight"
      ],
      "estimator_sha256": [
        "ppg_apply_bdt_macro",
        "ppg_recoeff_yaml_cpp_header_tree_receipt",
        "ppg_recoeff_source_macro",
        "ppg_recoeff_macro",
        "ppg_calculate_photon_yield"
      ]
    }
  },
  "lane_execution_contract": {
    "schema": "ppg12-stitched-purity-execution-contract/v1",
    "source_graph_columns": ["calo", "g4", "truthjet", "global", "mbd"],
    "source_graph": ["NONE", "g4", "truthjet", "NONE", "NONE"],
    "source_namespace_by_interaction": {
      "si": "js_pp200_signal",
      "di": "js_pp200_signal_dual"
    },
    "required_environment_common": {
      "RJ_IS_SIM": "1",
      "RJ_PPG12_PHOTON_YIELD": "1",
      "RJ_PPG12_PPSIM_REBUILD_CALO_FROM_G4": "1",
      "RJ_PPG12_PPSIM_G4_ONLY": "1",
      "RJ_PPG12_PHOTON_YIELD_ET_SMEAR": "1",
      "RJ_PPG12_PERIOD_USE_LUMI_WEIGHT": "1",
      "RJ_PPG12_PERIOD_ALLOW_ALL_SIM": "0",
      "RJ_PPG12_PERIOD_ALLOW_MIX_OVERRIDE": "0",
      "RJ_PPG12_PERIOD_ALLOW_VERTEX_FILE_OVERRIDE": "0"
    },
    "required_environment_by_interaction": {
      "si": {
        "RJ_PPG12_PHOTON_YIELD_DOUBLE": "0",
        "RJ_PPG12_PERIOD_STRICT_DI": "0"
      },
      "di": {
        "RJ_PPG12_PHOTON_YIELD_DOUBLE": "1",
        "RJ_PPG12_PERIOD_STRICT_DI": "1"
      }
    }
  },
  "global_minimality_contract": {
    "baseline_group_index": 0,
    "extra_group_order": ["group_index", "lane_id", "group_id"],
    "stop_at_first_complete_prefix": true,
    "required_observables": {
      "inclusive": ["A", "B", "C", "D"],
      "photon": ["A_signal", "B_signal", "C_signal", "D_signal"]
    }
  },
  "photon_canary_contract": {
    "required_candidate_trace_roles": ["candidate_rows"]
  },
  "canonical_tools": {
    "closure_gate": "scripts/diagnostics/pp_currentian/ppg12_stitched_purity_closure_gate.py",
    "assembler": "scripts/diagnostics/pp_currentian/assemble_ppg12_stitched_purity_manifest.py",
    "lane_extractor": "scripts/diagnostics/pp_currentian/extract_ppg12_stitched_purity_lane.py",
    "execution_contract_producer": "scripts/diagnostics/pp_currentian/produce_ppg12_stitched_purity_execution_contract.py",
    "candidate_summary_builder": "scripts/diagnostics/pp_currentian/run_ppg12_photon_oracle_canary_audit.py",
    "candidate_trace_auditor": "scripts/diagnostics/pp_currentian/audit_ppg12_recoiljets_paired_oracle.py",
    "purity_producer": "scripts/diagnostics/pp_currentian/produce_ppg12_stitched_purity_evidence.py",
    "merge_auditor": "scripts/diagnostics/pp_currentian/audit_the97_final_sim_merge.py",
    "ppg12_estimator_source": "ppg12codeGit/efficiencytool/CalculatePhotonYield.C"
  },
  "families": {
    "inclusive": {
      "samples": ["jet8", "jet12", "jet20", "jet30", "jet40"],
      "required_observables": [
        "A", "B", "C", "D",
        "A_signal", "B_signal", "C_signal", "D_signal",
        "A_notmatch", "B_notmatch", "C_notmatch", "D_notmatch"
      ]
    },
    "photon": {
      "samples": ["photon5", "photon10", "photon20"],
      "required_observables": ["A_signal", "B_signal", "C_signal", "D_signal"]
    }
  },
  "required_features": [
    "cluster_Et",
    "cluster_weta_cogx",
    "cluster_wphi_cogx",
    "vertexz",
    "cluster_Eta",
    "e11_over_e33",
    "cluster_et1",
    "cluster_et2",
    "cluster_et3",
    "cluster_et4",
    "e32_over_e35"
  ],
  "required_score_models": ["baseV3E", "base_E"],
  "required_tag_checks": ["common", "tight", "non_tight", "abcd"],
  "candidate_parity_tolerances": {
    "feature_abs_floor": 1e-6,
    "feature_relative": 1e-5,
    "score_abs": 1e-6
  },
  "paired_lane_fields": [
    "source_list_sha256",
    "event_set_sha256",
    "group_set_sha256",
    "config_sha256",
    "reconstruction_sha256",
    "model_set_sha256",
    "ownership_sha256",
    "weight_sha256",
    "estimator_sha256",
    "execution_contract_sha256"
  ],
  "production_frozen_lane_fields": [
    "source_list_sha256",
    "config_sha256",
    "reconstruction_sha256",
    "model_set_sha256",
    "ownership_sha256",
    "weight_sha256",
    "estimator_sha256",
    "execution_contract_sha256",
    "external_scale"
  ],
  "merge_required_object_family_tokens": {
    "inclusive": [
      "h_tight_iso_cluster_0",
      "h_tight_noniso_cluster_0",
      "h_nontight_iso_cluster_0",
      "h_nontight_noniso_cluster_0"
    ],
    "photon": [
      "h_tight_iso_cluster_signal_0",
      "h_tight_noniso_cluster_signal_0",
      "h_nontight_iso_cluster_signal_0",
      "h_nontight_noniso_cluster_signal_0"
    ]
  },
  "frozen_provenance_fields": [
    "implementation_sha256",
    "source_set_sha256",
    "config_contract_sha256",
    "model_set_sha256",
    "reconstruction_contract_sha256",
    "ownership_contract_sha256",
    "weights_contract_sha256",
    "estimator_contract_sha256"
  ],
  "tolerances": {
    "feature_abs_floor": 1e-6,
    "feature_relative": 1e-5,
    "score_abs": 1e-6,
    "weighted_cell_relative": 1e-6,
    "weighted_cell_abs_floor": 1e-12,
    "merge_abs": 1e-12,
    "purity_ratio_max_abs": 1e-4,
    "purity_ratio_rms": 2e-5,
    "historical_chi2_ndf_max": 1.5,
    "historical_pull_max_abs": 3.0,
    "historical_coherent_trend_max_sigma": 2.0
  },
  "production_historical_requirements": {
    "weighted_mean_ratio_compatible_with_unity_sigma": 1.0,
    "jet5_excluded": true,
    "jet8_external_scale_forbidden": true
  },
  "terminal_codes": {
    "PASS": 0,
    "reference_invalid": 10,
    "manifest_invalid": 11,
    "source_contract_failed": 12,
    "root_family_missing": 13,
    "binning_mismatch": 14,
    "merge_arithmetic_failed": 15,
    "canary_underpopulated": 16,
    "candidate_contract_failed": 17,
    "inclusive_abcd_failed": 18,
    "photon_leakage_failed": 19,
    "purity_solver_failed": 20,
    "stitched_purity_failed": 21,
    "hash_drift": 22,
    "promotion_blocked": 23
  }
}
