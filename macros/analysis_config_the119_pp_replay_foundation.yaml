# THE-119 p+p replay-foundation canary.  Detector capture is intentionally
# looser than the 15--35 GeV reporting selection; nominal tags are replayed
# from the exact THE-116 binned working points stored in RJModelEvaluationV1.
photon_eta_abs_max: 0.7
jet_pt_min: [5.0, 7.0, 10.0, 12.0]
jet_radii: [0.2, 0.3, 0.4]
back_to_back_dphi_min_pi_fraction: [0.5, 0.875]
use_vz_cut: true
vz_cut_cm: [10, 30, 60]
setMinBiasClassifer: true
centrality_edges: [0, 10, 20, 30, 40, 50, 60, 80]
clusterUEpipeline: [noSub]

isSlidingIso: true
isSlidingAndFixed: false
fixedGeV: [0.0]
coneR: [0.40, 0.30]
isolation_wp: {aGeV: 0.490, bPerGeV: 0.037, sideGapGeV: 0.8, truthIsoGeV: 4.0, towerMin: 0.0}
pp_iso_wp_r40: {aGeV: 0.490, bPerGeV: 0.037, sideGapGeV: 0.8}

photon_id_pre:   {e11e33_max: 0.98, et1_min: 0.60, et1_max: 1.00, e32e35_min: 0.80, e32e35_max: 1.00, weta_max: 0.60}
